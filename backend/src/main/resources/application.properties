server.port=${PORT:${SERVER_PORT:8081}}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=${DATABASE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_CONNECTION_TIMEOUT:10000}
spring.datasource.hikari.validation-timeout=${SPRING_DATASOURCE_VALIDATION_TIMEOUT:5000}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expirationMs=${APP_JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,https://localhost:*,http://127.0.0.1:*,https://127.0.0.1:*,http://10.*.*.*:*,https://10.*.*.*:*,http://192.168.*.*:*,https://192.168.*.*:*,https://*.trycloudflare.com}
app.seed.students=${APP_SEED_STUDENTS:false}
app.seed.reset-students=${APP_SEED_RESET_STUDENTS:false}
app.seed.sync-timetable=${APP_SEED_SYNC_TIMETABLE:false}
app.seed.replace-enrollments=${APP_SEED_REPLACE_ENROLLMENTS:false}
